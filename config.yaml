# ============================================================
#  Конфигурация голосового помощника «Миса»
#  Меняй тут — код трогать не нужно.
# ============================================================

# --- Пробуждение ---
assistant:
  # Имя, на которое реагирует помощник. Указывай несколько похожих
  # написаний — маленькая офлайн-модель Vosk слышит «Миса» по-разному
  # (мейсон, мяса, месса, мисс...). Все эти варианты = пробуждение.
  # Если какой-то вариант мешает (например, часто говоришь «мясо») —
  # просто убери строку.
  wake_words:
    - "миса"
    - "миша"
    - "миска"
    - "мейсон"
    - "мейс"
    - "мяса"
    - "мясо"
    - "месса"
    - "мисс"
  # Сколько секунд помощник ждёт команду после имени, прежде чем
  # снова "заснуть".
  listen_timeout: 8
  # Отвечать голосом на действия (True) или молча выполнять (False).
  speak_responses: true

# --- Распознавание речи ---
speech:
  # Движок: "whisper" — точнее, онлайн (через твой провайдер, напр. Groq);
  #         "vosk"    — офлайн, менее точный.
  engine: "whisper"

  # -- Whisper (онлайн) --
  whisper_model: "whisper-large-v3-turbo"
  language: "ru"
  vad_threshold: 500     # порог громкости для детекции речи (тише фон — меньше)
  silence_sec: 0.8       # пауза, после которой фраза считается законченной

  # -- Vosk (офлайн, запасной) --
  model_path: "models/vosk-model-small-ru-0.22"

  sample_rate: 16000
  # Индекс микрофона (null = системный по умолчанию).
  # Список устройств покажет:  python -m assistant.main --list-mics
  input_device: null

# --- Синтез речи (озвучка ответов) ---
tts:
  # Движок:
  #   "edge"   — онлайн-голоса Microsoft: естественно, надёжно, без обрывов,
  #              можно поднять питч до «анимешного» (нужен интернет). Рекоменд.
  #   "silero" — офлайн нейросетевой (torch + модель, install-voice.bat)
  #   "sapi5"  — системный голос Windows (роботно)
  engine: "edge"

  # -- Настройки edge-tts («анимешный» пресет: высокий милый голос) --
  # Женские русские голоса: ru-RU-SvetlanaNeural, ru-RU-DariyaNeural
  edge_voice: "ru-RU-SvetlanaNeural"
  edge_pitch: "+25Hz"    # выше = «анимешнее»/милее (попробуй +15..+45Hz)
  edge_rate: "+10%"      # чуть быстрее = живее (напр. +0%..+20%)

  # -- Настройки Silero --
  silero_model: "models/silero/v4_ru.pt"
  speaker: "baya"        # голоса: aidar, baya, kseniya, xenia, eugene
  sample_rate: 48000     # 8000 / 24000 / 48000 (выше — чище звук)

  # -- Настройки системного голоса (sapi5) --
  rate: 180              # скорость речи
  volume: 1.0            # громкость 0.0..1.0
  voice_hint: "ru"       # подстрока имени голоса SAPI5 (напр. "Irina", "ru")

# ============================================================
#  ИИ-МОЗГ  (понимает свободную речь, ведёт диалог, учит команды)
#  Ключ и провайдер задаются отдельно: python scripts\setup_ai.py
#  (он пишет secrets.yaml, который НЕ попадает в git).
# ============================================================
ai:
  enabled: true          # включить ИИ для нераспознанных фраз
  allow_shell: true      # разрешить ИИ выполнять команды системы (полный контроль)
  temperature: 0.3       # 0 — строже/предсказуемее, 1 — свободнее

  # «Зрение»: скриншот -> мультимодальный ИИ. Нужна модель, умеющая «видеть».
  # ВНИМАНИЕ: на бесплатном Groq vision-моделей нет — поэтому по умолчанию
  # выключено. Включи (enabled: true) и укажи model, если есть мультимодальный
  # доступ: локально Ollama (llama3.2-vision), либо платные Gemini/OpenAI.
  vision:
    enabled: false       # включи true, когда настроишь Ollama (см. ниже)
    provider: ""         # пусто = тот же, что основной. Для локального зрения: "ollama"
    model: ""            # для Ollama: "llama3.2-vision"
    max_width: 1280      # ширина, до которой ужимается скриншот

  # Автономный агент: «выполни задачу …» — делает её по шагам с проверкой.
  agent:
    max_steps: 8         # предохранитель: максимум шагов на одну задачу

# ============================================================
#  РЕЖИМЫ (промпт-пресеты) — «включи режим <название>».
#  Меняют характер/специализацию ИИ. «Обычный режим» — сброс.
#  Можно добавлять свои.
# ============================================================
prompts:
  "режим программиста": >
    Ты — опытный программист-ментор. Помогаешь с кодом, объясняешь ошибки
    по-русски и по делу, приводишь короткие примеры, предлагаешь лучшее решение.
  "режим кратко": >
    Отвечай максимально коротко — одно-два предложения, только суть, без воды.
  "режим учителя": >
    Ты терпеливый учитель. Объясняешь простыми словами, с примерами и аналогиями,
    как будто новичку.
  "режим переводчика": >
    Ты профессиональный переводчик. Переводи сказанное между русским и английским,
    сохраняя смысл и естественность. Давай только перевод.
  "режим копирайтера": >
    Ты копирайтер. Помогаешь писать и улучшать тексты: посты, письма, описания —
    живо, грамотно, под аудиторию.
  "режим тян": >
    Ты — милая, весёлая и слегка дерзкая аниме-тян. Отвечай эмоционально, с
    лёгким кокетством и юмором, но всё равно помогай по делу.
  "режим мотиватора": >
    Ты бодрый мотиватор. Поддерживаешь, заряжаешь энергией, помогаешь собраться
    и начать действовать.
  "деловой режим": >
    Ты деловой ассистент. Отвечай чётко, структурно, по пунктам, в рабочем тоне.

# ============================================================
#  ПРОГРАММЫ  —  "открой <ключ>"
#  key: путь к .exe / имя в PATH / ярлык
# ============================================================
apps:
  браузер: "start chrome"
  хром: "start chrome"
  блокнот: "notepad.exe"
  калькулятор: "calc.exe"
  проводник: "explorer.exe"
  ворд: "start winword"
  эксель: "start excel"
  paint: "mspaint.exe"
  диспетчер задач: "taskmgr.exe"
  параметры: "start ms-settings:"
  телеграм: "start telegram"     # если установлен
  дискорд: "start discord"

# ============================================================
#  САЙТЫ  —  "открой сайт <ключ>"  /  "зайди на <ключ>"
# ============================================================
sites:
  ютуб: "https://youtube.com"
  гугл: "https://google.com"
  почта: "https://mail.google.com"
  гитхаб: "https://github.com"
  переводчик: "https://translate.google.com"
  карты: "https://maps.google.com"
  погода: "https://yandex.ru/pogoda"
  новости: "https://news.google.com"
  вики: "https://ru.wikipedia.org"

# ============================================================
#  СЦЕНАРИИ (АЛГОРИТМЫ ДЕЙСТВИЙ)
#  Одна фраза -> цепочка шагов, выполняемых по порядку.
#  Типы шагов:
#    app:   <ключ из apps или сырая команда>
#    site:  <url или ключ из sites>
#    say:   <текст, который проговорит помощник>
#    key:   <hotkey для pyautogui, напр. "win+d", "ctrl+c">
#    type:  <текст, который "напечатается">
#    wait:  <секунды паузы>
#    run:   <произвольная shell-команда>
# ============================================================
scenarios:
  "рабочее место":
    - say: "Готовлю рабочее место"
    - app: "браузер"
    - wait: 1.5
    - site: "почта"
    - app: "ворд"
    - say: "Всё готово"

  "режим отдыха":
    - say: "Включаю режим отдыха"
    - site: "ютуб"

  "сверни всё":
    - key: "win+d"
    - say: "Свернула окна"
