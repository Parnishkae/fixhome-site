# ШАБЛОН YAML-плагина (не активен — имя начинается с "_").
# Чтобы включить: скопируй в файл без "_", например  my.yaml
#
# YAML-плагин не требует программирования: фраза -> список действий.

name: Название плагина

# (необязательно) Добавка к «характеру»/знаниям ИИ. Влияет на ответы ИИ.
prompt: "Ты также хорошо разбираешься в играх и советуешь по делу."

# Команды: фраза-триггер -> шаги (как в сценариях config.yaml).
# Типы шагов: say, app, site, search, key, type, wait, run/shell, scenario,
#             click, double_click, right_click, scroll.
commands:
  "открой рабочий стол":
    - key: "win+d"
    - say: "Готово"

  "сделай перерыв":
    - say: "Ставлю музыку и сворачиваю всё. Отдыхай!"
    - site: "ютуб"
    - key: "win+d"
